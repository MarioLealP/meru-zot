# Zot's push logins from OpenBao (D66): ESO logs in as the `eso` account (shared role meru-eso, D71 - OpenBao fills
# in the namespace from the login, so it reads apps/meru/zot/eso/* only) and writes zot-htpasswd, owning it (D68).
# Shikigami will rebuild it from every app's push login; for now it holds the copy meru-eso.sh made of the
# hand-made one. Store at wave -2 so it's validated before the ExternalSecret asks (-1); Zot (0) waits for both.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso # the identity ESO borrows to log in to OpenBao; no pod runs as it
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: https://openbao.clockmost.internal:8204
      path: apps
      version: v2
      caBundle:  # the clockmost root CA (public)
      auth:
        kubernetes:
          mountPath: kubernetes
          role: meru-eso
          serviceAccountRef:
            name: eso
            audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-htpasswd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 5m # a new login reaches the mounted file within minutes, no restart
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: zot-htpasswd
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: meru/zot/eso/zot-htpasswd
